<svg xmlns="http://www.w3.org/2000/svg" width="800" height="6" viewBox="0 0 800 6" preserveAspectRatio="none">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="25%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- blinking line -->
  <rect x="0" y="1.5" width="800" height="3" rx="1.5" fill="url(#fade)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- blinking diamond -->
  <rect x="396" y="1" width="8" height="4" rx="1" fill="#60a5fa" transform="rotate(45 400 3)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
